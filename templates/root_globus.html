<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OAuth demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
</head>

<body>


    <h1>Globus OAuth Portal</h1>
    {% if authenticated %}
    <div>
        <p>
            Logged in as: {{ user_info['name'] }} ({{user_info['identity_provider_display_name']}},
            {{user_info['preferred_username']}})
        </p>
        <p>
            <a
                href="https://tms-auth-service.tacc.cloud/login?idp_id=globus_idp&redirect_uri=https://tms-auth-service.tacc.cloud/">Link
                Resources via TMS</a>
        </p>
    </div>
    {% else %}
    <div>
        <p>You are not authenticated.</p>
        <p><a href="/login">Log In</a></p>
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
